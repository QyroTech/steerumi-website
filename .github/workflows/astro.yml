# Manual-only by design. Local development and pushes never deploy the site.
name: Publish Astro site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: "Type PUBLISH only after removing confidential/draft content and verifying all rights"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    if: inputs.confirm_publication == 'PUBLISH'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Resolve GitHub Pages destination
        id: pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci
      - name: Build and validate site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REQUIRE_PUBLICATION_READY: "1"
        run: npm run build && npm test
      - name: Upload static site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved static site
        id: deployment
        uses: actions/deploy-pages@v4
